<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey map preview</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/journey-map.css" />
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #F4F4F2; }
    #box { max-width: 1100px; margin: 0 auto; }
    #log { max-width: 1100px; margin: 12px auto; font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <!-- Dev-only: renders JourneyMap with stub data. Serve the repo root
       (python3 -m http.server 8765) and open /tests/journey-map-preview.html.
       Resize the window across ~880px to see the layout switch. -->
  <div id="box"></div>
  <div id="log">Click a stop…</div>
  <script src="../js/journey-map.js"></script>
  <script>
    JourneyMap.render(document.getElementById('box'), {
      firstName: 'Scott', baptizedAt: '2025-05-01', memberSince: '2025-06-01', email: 'scott@example.com',
      groups: [{ id: 1, name: 'Tuesday Night', leaderEmail: 'someone@example.com' }],
      groupMemberships: [{ groupId: 1, leftAt: null, joinedAt: '2025-08-17' }],
      gtRegistrations: [{ part: 'about_us', attended: false, sessionDate: '2025-10-05' }],
      discAttemptCount: 1, giftsAttemptCount: 1,
      discDates: ['2025-09-14T15:00:00Z'], giftsDates: ['2025-09-21T15:00:00Z'],
      teamMemberships: [], teams: [],
    }, { onStopClick: s => { document.getElementById('log').textContent = 'Clicked ' + s.key + ' → tab ' + s.tab; } });
  </script>
</body>
</html>
